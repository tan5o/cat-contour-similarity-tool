name: Test & Build

on:
  push:
    branches: ['main']
  pull_request:
  # 他のワークフローから呼び出し可能にする
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build prefecture features
        run: npm run build:pref

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests
        run: npm run test:run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests (モックテスト)
        run: npx playwright test --grep-invert @real-inference

      - name: Run E2E tests (実推論テスト、chromiumのみ)
        run: npx playwright test --grep @real-inference --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Build
        run: npm run build
